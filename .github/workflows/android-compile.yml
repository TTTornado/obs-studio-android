name: Android compile check

# 目的：在没有本地环境的情况下，验证 Android 移植的**编译与链接**是否正确。
#
# 范围（本 workflow 只做这些）：
#   * 交叉编译 14 个第三方依赖（deps-android）
#   * 配置并构建 libobs / libobs-opengl(GLES) / 全部 android-* 采集插件
#
# 不做的：
#   * Qt 前端 —— 用 -DENABLE_FRONTEND=OFF 跳过（见 android/compile-check.sh 的说明）。
#     Qt 6.9.3 的获取方式待定，前端编译验证另行处理。
#   * APK 打包 / 签名 —— 那是下一步
#   * 真机行为 —— 相机、UVC、MediaProjection、AAudio、推流都无法在 CI 验证
#
# 磁盘：实测 ubuntu-24.04 runner 的根分区是 145 GB 总量 / 约 86 GB 可用
# （见本 workflow 首个 df 步骤的实际输出），而本 workflow 需要 20–35 GB，
# 因此**不需要**任何腾空间的 action。早前"14 GB 不够用"的判断是基于过时的
# runner 规格文档，已被实测推翻。df 步骤保留，仅用于观测。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cmake/android/**'
      - 'libobs/**'
      - 'libobs-opengl/**'
      - 'plugins/**'
      - 'frontend/cmake/**'
      - 'frontend/plugin-manager/**'
      - 'frontend/utility/**'
      - 'frontend/widgets/OBSAndroid*'
      - 'android/**'
      - '.github/workflows/android-compile.yml'
  pull_request:
    paths:
      - 'cmake/android/**'
      - 'libobs/**'
      - 'libobs-opengl/**'
      - 'plugins/**'
      - 'android/**'
      - '.github/workflows/android-compile.yml'

concurrency:
  group: android-compile-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: '30.0.16138531'
  ABI: arm64-v8a
  API: '29'
  # checkout 默认不取 tag，git describe 只能返回裸 SHA，会让
  # cmake/common/versionconfig.cmake 的版本解析失败。显式给定版本可绕过。
  # 升级上游基线时同步改这里（同时改 android/compile-check.sh 的默认值）。
  OBS_VERSION_OVERRIDE: '33.0.0'

jobs:
  compile:
    name: 依赖 + 编译验证 (arm64-v8a, 无 Qt)
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: 磁盘实况（构建前）
        run: |
          echo "::group::df -h"
          df -h / /mnt 2>/dev/null || df -h
          echo "::endgroup::"

      - name: 安装 NDK ${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          [ -n "$SDKMANAGER" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
          echo "sdkmanager = $SDKMANAGER"

          # 已装过就直接用（runner 镜像可能自带）
          if [ -d "$SDK/ndk/$NDK_VERSION" ]; then
            echo "NDK $NDK_VERSION 已存在，跳过安装"
          else
            # 不能用 `yes | sdkmanager ... || exit` 判成败：sdkmanager 读完输入就退出，
            # yes 收到 SIGPIPE 返回非零，在 pipefail 下会把"安装成功"误判成失败。
            # 首次运行正是栽在这里——日志显示解压 100% 完成、目录已出现，
            # 却因为 `yes: Broken pipe` 走进了错误分支。故忽略退出码，以目录为准。
            set +e
            yes 2>/dev/null | "$SDKMANAGER" --install "ndk;$NDK_VERSION" --sdk_root="$SDK"
            set -e
            if [ ! -d "$SDK/ndk/$NDK_VERSION" ]; then
              echo "::error::NDK $NDK_VERSION 安装失败，已安装版本："
              ls "$SDK/ndk" 2>/dev/null || true
              exit 1
            fi
          fi
          echo "NDK_ROOT=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: 恢复依赖缓存
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            android/deps-android/prebuilt
            ~/deps-work/state
          # 故意不加 restore-keys：依赖版本一变（versions.sh 参与 hash）就必须整份重建，
          # 否则会把旧缓存捞回来，build.sh 看到旧 stamp 直接跳过，产物还是旧版本。
          key: deps-${{ env.ABI }}-${{ hashFiles('android/deps-android/versions.sh', 'android/deps-android/defs.sh') }}

      - name: 下载依赖源码
        run: bash android/deps-android/fetch.sh
        env:
          OBS_PROXY: ''          # CI 直连，不走代理

      - name: 交叉编译依赖
        run: bash android/deps-android/build.sh "${ABI}"
        env:
          NDK: ${{ env.NDK_ROOT }}
          JOBS: 4

      # 用 cache/save 显式保存，而不是依赖 actions/cache 的 post 步骤：
      # post 步骤在 job 失败时会被跳过（首次运行就是 skipped），
      # 那样后面编译一失败就得重编 30 分钟的依赖。
      - name: 保存依赖缓存
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            android/deps-android/prebuilt
            ~/deps-work/state
          key: deps-${{ env.ABI }}-${{ hashFiles('android/deps-android/versions.sh', 'android/deps-android/defs.sh') }}

      - name: 磁盘实况（依赖构建后）
        run: |
          echo "::group::df -h"
          df -h /
          echo "::endgroup::"
          du -sh android/deps-android/prebuilt 2>/dev/null || true
          du -sh "${HOME}/deps-work" 2>/dev/null || true

      - name: 编译验证（libobs + GLES + 全部插件，跳过 Qt）
        run: |
          set -o pipefail
          bash android/compile-check.sh 2>&1 | tee compile.log
        env:
          NDK: ${{ env.NDK_ROOT }}

      # 归档链接产物：让"到底生成了哪些 .so、多大、符号在不在"可查，
      # 而不是只能从日志里推断。
      - name: 归档链接产物
        if: success()
        run: |
          echo "::group::产物清单"
          find build-android-* -name '*.so' -printf '%10s  %p\n' | sort -k2
          echo "::endgroup::"
          {
            echo "# 链接产物清单（$(date -u +%FT%TZ)）"
            echo
            echo '```'
            find build-android-* -name '*.so' -printf '%10s  %p\n' | sort -k2
            echo '```'
            echo
            echo "## libobs.so 的 main 动态符号（APK 能否起的关键）"
            echo '```'
            NDK_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
            "$NDK_BIN/llvm-readelf" --dyn-syms build-android-*/libobs/libobs.so 2>/dev/null | grep -w main || echo "（未找到 main）"
            echo '```'
          } > artifacts-manifest.md
          cat artifacts-manifest.md

      - name: 上传链接产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-libs
          path: |
            artifacts-manifest.md
            build-android-*/libobs/libobs.so
            build-android-*/libobs-opengl/*.so
            build-android-*/plugins/**/*.so
          if-no-files-found: warn
          retention-days: 14

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-logs
          path: |
            compile.log
            build-android-*/CMakeFiles/CMakeOutput.log
            build-android-*/CMakeFiles/CMakeError.log
          if-no-files-found: warn
          retention-days: 7

      - name: 磁盘实况（结束时）
        if: always()
        run: df -h /

  qt-probe:
    name: Qt 可用性探测
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 只用来回答一个问题：Qt 6.9.3 的 android_arm64_v8a 到底能不能匿名下载。
    # 不阻塞主构建，失败也不影响编译验证的结论。
    continue-on-error: true

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 aqtinstall
        run: pip install --quiet aqtinstall

      - name: 列出可用的 Android Qt 版本
        run: |
          echo "::group::aqt list-qt linux android"
          aqt list-qt linux android || echo "(命令失败)"
          echo "::endgroup::"

      - name: 探测 6.9.3 的架构与模块
        run: |
          for v in 6.9.3 6.8.0 6.7.3; do
            echo "::group::$v"
            aqt list-qt linux android --arch "$v" || echo "  无此版本或查询失败"
            echo "::endgroup::"
          done

      - name: 探测 desktop 宿主套件（androiddeployqt 来源）
        run: |
          echo "::group::aqt list-qt linux desktop --arch 6.9.3"
          aqt list-qt linux desktop --arch 6.9.3 || echo "  无此版本或查询失败"
          echo "::endgroup::"

      - name: 结论
        run: |
          echo "把上面的输出贴回会话，即可确定 Qt 版本策略。"

  # 阶段 2：打可安装的 APK。
  #
  # 用 Qt 6.7.3（公开镜像上 Android 套件的最新版本；6.8/6.9 拿不到，见 qt-probe job）。
  # 实测 OBS 33.0 前端对 Qt 6.9 的**编译期**硬依赖只有 1 行
  # （InstalledPluginRow.cpp 的 QString::arg(std::string_view)），已在源码里做了兼容，
  # 所以 6.7.3 足够出包。
  #
  # 这个 job 不再 continue-on-error：要的就是"能不能拿到一个能装的包"这个确定答案。
  apk:
    name: 打 APK (Qt 6.7.3, arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # 依赖 compile job 先把 deps 缓存存下来（这里 fail-on-cache-miss 强制要求命中）。
    needs: compile

    env:
      QT_VERSION: '6.7.3'
      QT_ROOT: ${{ github.workspace }}/.qt

    steps:
      - uses: actions/checkout@v4

      - name: 磁盘实况
        run: df -h /

      - name: 安装 NDK ${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(command -v sdkmanager || ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          [ -n "$SDKMANAGER" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
          if [ ! -d "$SDK/ndk/$NDK_VERSION" ]; then
            set +e
            yes 2>/dev/null | "$SDKMANAGER" --install "ndk;$NDK_VERSION" --sdk_root="$SDK"
            set -e
          fi
          [ -d "$SDK/ndk/$NDK_VERSION" ] || { echo "::error::NDK 安装失败"; exit 1; }
          echo "NDK_ROOT=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # Qt 6.7.3 自带 AGP 7.4.1（官方只测到 compileSdk 33），而 androiddeployqt 会挑
      # 这台镜像上**最新**的平台 —— 实测挑到了 android-36-ext19。那个平台的 android.jar
      # 是 preview/ext 变体，AGP 7.4.1 的 aapt2 解析不了：
      #
      #   aapt2 E Failed to load resources table in APK '.../platforms/android-36-ext19/android.jar'
      #   error: failed to load include path .../android-36-ext19/android.jar
      #   > Task :processReleaseResources FAILED
      #
      # 我们 CMake 里设的 QT_ANDROID_COMPILE_SDK_VERSION 35 在这条路上没被采纳，
      # 所以改用更确定的办法：把 36.x 与所有 *-ext* 变体卸掉，只留 android-35
      # （正好是本仓库的 targetSdk）。
      - name: 收敛 Android 平台到 35
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(command -v sdkmanager || ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          [ -n "$SDKMANAGER" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
          echo "---- 卸载前 ----"
          ls -1 "$SDK/platforms" || true
          for p in android-37.2-beta3 android-37.2-beta2 android-37.2-beta1 android-37.2 \
                   android-37.1 android-37.0 android-36.1 android-36-ext19 android-36-ext18 \
                   android-36 android-35-ext15 android-35-ext14; do
            [ -d "$SDK/platforms/$p" ] || continue
            echo "卸载 platforms;$p"
            sudo "$SDKMANAGER" --uninstall "platforms;$p" >/dev/null 2>&1 || echo "  （失败，忽略）"
          done
          [ -d "$SDK/platforms/android-35" ] || sudo "$SDKMANAGER" --install "platforms;android-35" --sdk_root="$SDK"
          echo "---- 卸载后 ----"
          ls -1 "$SDK/platforms"
          [ -d "$SDK/platforms/android-35" ] || { echo "::error::android-35 平台不存在"; exit 1; }

      - name: 恢复依赖缓存
        uses: actions/cache/restore@v4
        with:
          path: |
            android/deps-android/prebuilt
            ~/deps-work/state
          key: deps-${{ env.ABI }}-${{ hashFiles('android/deps-android/versions.sh', 'android/deps-android/defs.sh') }}
          fail-on-cache-miss: true

      - name: 缓存 Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_ROOT }}
          key: qt-${{ env.QT_VERSION }}-android-arm64

      - name: 安装 Qt ${{ env.QT_VERSION }}
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          pip install --quiet aqtinstall
          aqt install-qt linux android "${QT_VERSION}" android_arm64_v8a -O "${QT_ROOT}"
          aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 -O "${QT_ROOT}"
          echo "::group::安装结果"
          ls -1 "${QT_ROOT}/${QT_VERSION}"
          echo "::endgroup::"

      - name: 构建 + 打包 + 签名
        run: |
          set -o pipefail
          # Gradle 8.14 不支持 JDK 21+，runner 默认就是 17，这里显式钉一下
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then export JAVA_HOME="$JAVA_HOME_17_X64"; fi
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1 | sed 's/^/  /'
          QT_DIR="${QT_ROOT}/${QT_VERSION}/android_arm64_v8a" \
          QT_HOST_PATH="${QT_ROOT}/${QT_VERSION}/gcc_64" \
          NDK="${NDK_ROOT}" \
          bash android/build-apk.sh 2>&1 | tee apk.log
        env:
          NDK: ${{ env.NDK_ROOT }}

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Android-apk
          path: OBS-Android-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 失败时诊断
        if: failure()
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "::group::SDK 里的平台"
          ls -1 "$SDK/platforms" 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::Qt 生成的 deployment settings"
          for f in build-android-apk-*/frontend/android-*-deployment-settings.json; do
            [ -f "$f" ] || continue
            echo "--- $f"
            grep -E 'android-platform|sdk|target|min' "$f" || true
          done
          echo "::endgroup::"
          echo "::group::生成的 build.gradle 里的 SDK 设置"
          for f in build-android-apk-*/frontend/android-build/build.gradle; do
            [ -f "$f" ] || continue
            echo "--- $f"
            grep -nE 'compileSdk|targetSdk|minSdk|buildToolsVersion|classpath' "$f" || true
          done
          echo "::endgroup::"

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-logs
          path: |
            apk.log
            build-android-apk-*/CMakeFiles/CMakeOutput.log
            build-android-apk-*/CMakeFiles/CMakeError.log
            build-android-apk-*/frontend/android-*-deployment-settings.json
            build-android-apk-*/frontend/android-build/build.gradle
            build-android-apk-*/frontend/android-build/build/outputs/logs/*.txt
          if-no-files-found: warn
          retention-days: 7

      - name: 磁盘实况（结束时）
        if: always()
        run: df -h /
